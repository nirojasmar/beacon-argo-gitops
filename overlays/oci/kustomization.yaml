apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: beacon-oci-settings
    envs:
      - config.env
    options:
      disableNameSuffixHash: true

images:
  - name: beacon
    newName: ghcr.io/nirojasmar/beacon
    newTag: git-4fd1cc6

replacements:
  - source:
      kind: ConfigMap
      name: beacon-oci-settings
      fieldPath: data.INGRESS_HOST
    targets:
      - select:
          kind: Ingress
          name: beacon
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: beacon-oci-settings
      fieldPath: data.K3S_API_CIDR
    targets:
      - select:
          kind: NetworkPolicy
          name: beacon-scheduler-control-plane-egress
        fieldPaths:
          - spec.egress.0.to.0.ipBlock.cidr

