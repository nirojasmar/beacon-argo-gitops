apiVersion: v1
kind: Service
metadata:
  name: nats
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: client

