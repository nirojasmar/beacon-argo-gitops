apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beacon
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: beacon.203-0-113-10.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beacon-api
                port:
                  name: http

