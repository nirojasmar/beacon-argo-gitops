apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: beacon

resources:
  - namespace.yaml
  - configmap.yaml
  - service-accounts.yaml
  - rbac/scheduler.yaml
  - quota.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - nats
  - api
  - scheduler
  - checker
  - notifier
  - digest

labels:
  - pairs:
      app.kubernetes.io/part-of: beacon
    includeSelectors: false
    includeTemplates: true
