apiVersion: v1
kind: ResourceQuota
metadata:
  name: beacon-quota
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: beacon-defaults
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 20m
        memory: 32Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 1Gi

