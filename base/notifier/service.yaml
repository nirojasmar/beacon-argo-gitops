apiVersion: v1
kind: Service
metadata:
  name: beacon-notifier-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: notifier
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics

