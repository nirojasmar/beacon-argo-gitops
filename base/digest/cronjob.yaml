apiVersion: batch/v1
kind: CronJob
metadata:
  name: beacon-digest
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: beacon
            app.kubernetes.io/component: digest
        spec:
          serviceAccountName: beacon-digest
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: beacon:latest
              imagePullPolicy: IfNotPresent
              command: ["/beacon", "digest"]
              envFrom:
                - configMapRef:
                    name: beacon-config
                - secretRef:
                    name: beacon-secrets
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

