    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: checker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics

