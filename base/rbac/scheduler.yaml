apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: beacon-scheduler
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: beacon-scheduler
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: beacon-scheduler
    namespace: beacon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: beacon-scheduler

