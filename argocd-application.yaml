apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beacon
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nirojasmar/beacon-argo-gitops.git
    targetRevision: main
    path: overlays/oci
  destination:
    server: https://kubernetes.default.svc
    namespace: beacon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

